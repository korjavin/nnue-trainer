# docker-compose.yml
version: "3.8"

services:
  nnue-trainer-bot:
    # The image tag will be replaced by the GitHub Actions workflow in the deploy branch
    image: ghcr.io/korjavin/nnue-trainer:latest
    container_name: nnue-trainer-bot
    networks:
      - virusgame-network
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-ws://virusgame-backend:8080/ws?bot=true&namePrefix=JavaBot}
      - CHALLENGER_MODE=${CHALLENGER_MODE:-false}
      # Deploy the STRONG bot: GoBot search + hand-tuned eval. Time mode (wall-clock deadline)
      # engages the enhanced stack fully — lazy SMP (~4x nodes/sec), warm cross-move TT, deadline
      # salvage; verified 62%±2.4 vs the node-budget-era baseline at equal time. The old fixed
      # 60k-node default underuses the upgrade (it just moves faster, not deeper). Override via
      # env if needed; GOBOT_NODE_LIMIT + empty GOBOT_TIME_MODE restores the deterministic budget.
      # RL champion promotion path: SEARCH=MCTS plays the PUCT searcher with the trained policy
      # prior (MCTS_PRIOR, default mcts_champion.json then mcts_policy.json; MCTS_VALUE=net
      # enables the artifact's value head, MCTS_MOVE_MILLIS budgets each move). See
      # docs/server-training.md "how promotion works".
      - SEARCH=${SEARCH:-GOBOT}
      - EVAL=${EVAL:-HANDTUNED}
      - GOBOT_TIME_MODE=${GOBOT_TIME_MODE:-1}
      # MCTS mode passthrough (empty = feature default): stack env only substitutes into this
      # template, it is not auto-injected — every knob needs an explicit line here.
      - MCTS_VALUE=${MCTS_VALUE:-}
      - MCTS_PRIOR=${MCTS_PRIOR:-}
      - MCTS_MOVE_MILLIS=${MCTS_MOVE_MILLIS:-}
      - MCTS_CPUCT=${MCTS_CPUCT:-}

  # Opt-in training sidecar — NOT started by default (compose profile "trainer").
  # Portainer: add stack env var COMPOSE_PROFILES=trainer to enable on a host.
  # See docs/server-training.md.
  trainer:
    image: ghcr.io/korjavin/nnue-trainer-trainer:latest
    container_name: nnue-trainer-trainer
    profiles: ["trainer"]
    restart: unless-stopped
    # Plain cpus/mem_limit (not deploy.resources): honored by docker compose v2,
    # podman-compose, and Portainer stacks without swarm mode.
    cpus: 4.0
    mem_limit: 3g
    networks:
      - virusgame-network
    environment:
      - TRAINER_LOOP=${TRAINER_LOOP:-mcts}
      - TRAIN_SCHEDULE_HOUR=${TRAIN_SCHEDULE_HOUR:-3}
      - GAMES=${TRAINER_GAMES:-1000}
      - SIMS=${TRAINER_SIMS:-192}
      - GAMES_URL=${GAMES_URL:-https://vs.wandergeek.org/data/games.db}
      - MIN_NEW_GAMES=${MIN_NEW_GAMES:-25}
      - RL_REQUIRE_NEW_GAMES=${RL_REQUIRE_NEW_GAMES:-0}
    volumes:
      - trainer-work:/work

volumes:
  trainer-work:

networks:
  virusgame-network:
    name: ${NETWORK_NAME:-virusgame-network}
    external: true
