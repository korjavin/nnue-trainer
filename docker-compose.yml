# docker-compose.yml
version: "3.8"

services:
  nnue-trainer-bot:
    # The image tag will be replaced by the GitHub Actions workflow in the deploy branch
    image: ghcr.io/korjavin/nnue-trainer:latest
    container_name: nnue-trainer-bot
    networks:
      - virusgame-network
    restart: unless-stopped
    environment:
      - BACKEND_URL=${BACKEND_URL:-ws://virusgame-backend:8080/ws?bot=true&namePrefix=JavaBot}
      - CHALLENGER_MODE=${CHALLENGER_MODE:-false}
      # Deploy the STRONG bot: GoBot search + hand-tuned eval. Time mode (wall-clock deadline)
      # engages the enhanced stack fully — lazy SMP (~4x nodes/sec), warm cross-move TT, deadline
      # salvage; verified 62%±2.4 vs the node-budget-era baseline at equal time. The old fixed
      # 60k-node default underuses the upgrade (it just moves faster, not deeper). Override via
      # env if needed; GOBOT_NODE_LIMIT + empty GOBOT_TIME_MODE restores the deterministic budget.
      - SEARCH=${SEARCH:-GOBOT}
      - EVAL=${EVAL:-HANDTUNED}
      - GOBOT_TIME_MODE=${GOBOT_TIME_MODE:-1}

networks:
  virusgame-network:
    name: ${NETWORK_NAME:-virusgame-network}
    external: true
