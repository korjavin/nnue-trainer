name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Check Formatting with Spotless
      run: ./mvnw spotless:check --file pom.xml

    - name: Build and Test with Maven
      run: ./mvnw -B clean test --file pom.xml

    # The ridge fitter is the only non-trivial math in the v3 capacity bead, and it also
    # validates the committed nnue_v3_weights.json artifact.
    - name: Test the v3 capacity fitter
      run: |
        pip install --quiet numpy
        python3 -m unittest discover -s python/v3 -p "*_test.py"
